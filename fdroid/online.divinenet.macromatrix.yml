Categories:
  - Sports & Health
License: AGPL-3.0-only
AuthorName: DivineNet
AuthorEmail: privacy@divinenet.online
WebSite: https://app.divinenet.online
SourceCode: https://github.com/Tanatloc/macromatrix
IssueTracker: https://github.com/Tanatloc/macromatrix/issues
Changelog: https://github.com/Tanatloc/macromatrix-releases/releases

AutoName: MacroMatrix

RepoType: git
Repo: https://github.com/Tanatloc/macromatrix.git

AntiFeatures:
  NonFreeNet:
    en-US: The app works without an account. Optionally, syncing your account uses a hosted Supabase backend; branded products come from Open Food Facts and USDA, and voice logging on phones without speech recognition uses Cloudflare Workers AI.

Builds:
  - versionName: 1.3.5
    versionCode: 18
    commit: v1.3.5
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.7
    rm:
      - ios
      - macos
      - windows
      - linux
      - web
      - site
      - design
    prebuild:
      - tool/fdroid_no_billing.sh
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --dart-define-from-file=supabase.json

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.3.5
CurrentVersionCode: 18
