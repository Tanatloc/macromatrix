AntiFeatures:
  NonFreeAssets:
    en-US: The built-in food database includes the Dutch NEVO table (RIVM), which
      may be redistributed unchanged but is not under a free licence.
  NonFreeNet:
    en-US: The app works offline and without an account. Optional features use online
      services; syncing your account goes through the MacroMatrix server (Cloudflare),
      branded products come from Open Food Facts and USDA, and meal photo scans, label
      scans and voice logging on phones without speech recognition use Cloudflare
      Workers AI.
Categories:
  - Diet
  - Health Manager
License: AGPL-3.0-only
AuthorName: VanoWeb
AuthorEmail: privacy@macromatrix.eu
WebSite: https://macromatrix.eu
SourceCode: https://github.com/Tanatloc/macromatrix
IssueTracker: https://github.com/Tanatloc/macromatrix/issues
Changelog: https://github.com/Tanatloc/macromatrix-releases/releases

AutoName: MacroMatrix

RepoType: git
Repo: https://github.com/Tanatloc/macromatrix.git

Builds:
  - versionName: 1.22.0
    versionCode: 58
    commit: 65c7eeea687b19536a39f01c209ef9b6d6879d5e
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.7
    rm:
      - windows
      - linux
      - web
      - site
      - design
    prebuild:
      - tool/fdroid_no_billing.sh
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --dart-define-from-file=supabase.json

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.22.0
CurrentVersionCode: 58
