    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0E6B65"/><stop offset="1" stop-color="#3FB68C"/></linearGradient>
    <clipPath id="c"><path d="M232 792 C 232 432, 432 232, 792 232 C 792 592, 592 792, 232 792 Z"/></clipPath>
