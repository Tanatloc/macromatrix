<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14857D"/>
      <stop offset="1" stop-color="#0A4F4A"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <!-- 3x3 matrix van voedingsstoffen: drie macro's en zes micro's, die samen een M vormen -->
  <g transform="translate(212 212)">
    <rect x="0"   y="0"   width="168" height="168" rx="44" fill="#FFFFFF"/>
    <rect x="216" y="0"   width="168" height="168" rx="44" fill="#FFFFFF" opacity="0.22"/>
    <rect x="432" y="0"   width="168" height="168" rx="44" fill="#FFFFFF"/>
    <rect x="0"   y="216" width="168" height="168" rx="44" fill="#FFFFFF"/>
    <rect x="216" y="216" width="168" height="168" rx="44" fill="#F2B14C"/>
    <rect x="432" y="216" width="168" height="168" rx="44" fill="#FFFFFF"/>
    <rect x="0"   y="432" width="168" height="168" rx="44" fill="#7F96FF"/>
    <rect x="216" y="432" width="168" height="168" rx="44" fill="#FFFFFF" opacity="0.22"/>
    <rect x="432" y="432" width="168" height="168" rx="44" fill="#F08DB2"/>
  </g>
</svg>
