<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Zoeken en loggen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-light{--bg:#F4F3EF;--surface:#FFFFFF;--surface-2:#FAF9F6;--sunken:#EEECE7;--line:#E4E1DA;--line-strong:#D3CFC6;--ink:#15171A;--ink-2:#4B5058;--ink-3:#676C75;--brand:#0E6B65;--brand-soft:#E2EFEC;--on-brand:#FFFFFF;--protein:#3D5BD9;--carbs:#B8741A;--fat:#A9466B;--fiber:#2E7D5B;--low:#9A5B00;--low-fill:#D98E1F;--low-soft:#FBEEDA;--ok:#1C7357;--ok-fill:#2A9D74;--ok-soft:#E1F0E9;--high:#B3362A;--high-fill:#D2513F;--high-soft:#F8E2DE;--track:#ECE9E3;--shadow:0 1px 2px rgba(21,23,26,.04),0 12px 32px -18px rgba(21,23,26,.22)}
.t-dark{--bg:#0D0F11;--surface:#15181B;--surface-2:#1A1E22;--sunken:#111316;--line:#25292E;--line-strong:#343A41;--ink:#ECEDEF;--ink-2:#A8ADB5;--ink-3:#8B919A;--brand:#5BC3B6;--brand-soft:#132B28;--on-brand:#06201D;--protein:#8FA3FF;--carbs:#E3A956;--fat:#E08BAA;--fiber:#6CC79A;--low:#E7A651;--low-fill:#D99434;--low-soft:#2E2412;--ok:#62C99E;--ok-fill:#3BAA80;--ok-soft:#12291F;--high:#F0806F;--high-fill:#D9604E;--high-soft:#351A16;--track:#22262B;--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 14px 32px -20px rgba(0,0,0,.9)}
.num{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.eyebrow{font-family:'Geist Mono',ui-monospace,monospace;font-size:10.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand)}a:hover{color:var(--ink)}
</style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 1100px; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Geist', system-ui, sans-serif; font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased">
  <header style="display: flex; align-items: center; gap: 10px; padding: 18px 16px 10px">
    <a href="Main.dc.html" aria-label="Terug" style="width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; flex: 1">
      <span class="eyebrow">Toevoegen aan</span>
      <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.015em">Avondeten</span>
    </div>
    <span class="num" style="font-size: 12px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px">610 kcal over</span>
  </header>

  <div style="display: flex; gap: 8px; padding: 4px 16px 0">
    <label style="flex: 1; height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--ink); box-sizing: border-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Zoek een product</span>
      <input value="zalm" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 16px; color: var(--ink)">
      <span class="num" style="font-size: 11.5px; color: var(--ink-3)">38</span>
    </label>
    <a href="Food.dc.html" aria-label="Barcode scannen" style="width: 48px; height: 48px; border-radius: 14px; background: var(--ink); color: var(--bg); display: grid; place-items: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 8v8M11 8v8M14 8v8M17 8v8"></path></svg>
    </a>
  </div>

  <div style="display: flex; gap: 6px; padding: 12px 16px 4px; overflow: hidden">
    <sc-for list="{{scopes}}" as="s" hint-placeholder-count="5">
      <button style="flex: none; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid {{s.border}}; background: {{s.bg}}; color: {{s.color}}; font-size: 13px; font-weight: 500">{{s.label}}</button>
    </sc-for>
  </div>

  <p style="margin: 8px 20px 6px; font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px">
    <span style="width: 8px; height: 8px; border-radius: 50%; box-sizing: border-box; border: 2px solid var(--low-fill)"></span>
    Gemarkeerd: wat dit product toevoegt aan je tekorten van vandaag
  </p>

  <ul aria-label="Resultaten" style="list-style: none; margin: 0; padding: 0 16px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{results}}" as="r" hint-placeholder-count="5">
      <li>
        <a href="Food.dc.html" style="display: flex; flex-direction: column; gap: 9px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; color: var(--ink); text-decoration: none">
          <span style="display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; column-gap: 10px; align-items: start">
            <span class="num" style="height: 22px; border-radius: 6px; background: var(--sunken); color: var(--ink-2); font-size: 10px; font-weight: 600; display: grid; place-items: center; margin-top: 1px">{{r.src}}</span>
            <span style="display: flex; flex-direction: column; min-width: 0">
              <span style="font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em">{{r.name}}</span>
              <span style="font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span>
            </span>
            <span style="display: flex; flex-direction: column; align-items: flex-end">
              <span class="num" style="font-size: 14px; font-weight: 600">{{r.kcal}}</span>
              <span style="font-size: 10.5px; color: var(--ink-3)">kcal/100 g</span>
            </span>
          </span>
          <span style="display: grid; grid-template-columns: 30px minmax(0, 1fr); column-gap: 10px; align-items: center">
            <span></span>
            <span style="display: flex; flex-direction: column; gap: 8px">
              <span style="display: flex; align-items: center; gap: 10px">
                <span style="display: flex; height: 4px; width: 72px; border-radius: 2px; overflow: hidden; gap: 1.5px; flex: none">
                  <span style="flex: {{r.p}}; background: var(--protein)"></span>
                  <span style="flex: {{r.c}}; background: var(--carbs)"></span>
                  <span style="flex: {{r.f}}; background: var(--fat)"></span>
                </span>
                <span class="num" style="font-size: 11.5px; color: var(--ink-2)">E {{r.pg}} · K {{r.cg}} · V {{r.fg}}</span>
              </span>
              <span style="display: flex; flex-wrap: wrap; gap: 5px">
                <sc-for list="{{r.tags}}" as="t" hint-placeholder-count="2">
                  <span class="num" style="display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; background: {{t.bg}}; color: {{t.color}}; font-size: 11px; font-weight: 500">{{t.label}}</span>
                </sc-for>
              </span>
            </span>
          </span>
        </a>
      </li>
    </sc-for>
  </ul>

  <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 18px 20px 8px">
    <h2 style="margin: 0; font-size: 14px; font-weight: 600">Recent gebruikt</h2>
    <span style="font-size: 12px; color: var(--ink-3)">Tik + voor dezelfde hoeveelheid</span>
  </div>
  <ul aria-label="Recent gebruikt" style="list-style: none; margin: 0 16px; padding: 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px">
    <sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
      <li style="display: grid; grid-template-columns: minmax(0, 1fr) auto 40px; align-items: center; column-gap: 10px; padding: 10px 0; border-bottom: 1px solid {{r.border}}">
        <span style="display: flex; flex-direction: column; min-width: 0">
          <span style="font-size: 14px; font-weight: 500">{{r.name}}</span>
          <span class="num" style="font-size: 11.5px; color: var(--ink-3)">{{r.amount}}</span>
        </span>
        <span class="num" style="font-size: 12.5px; color: var(--ink-2)">{{r.kcal}}</span>
        <button aria-label="{{r.aria}}" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line-strong); background: transparent; display: grid; place-items: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </li>
    </sc-for>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const scopes = ['Alles', 'Basis', 'Merken', 'Mijn producten', 'Recepten'].map((label, i) => ({
      label,
      bg: i === 0 ? 'var(--ink)' : 'var(--surface)',
      color: i === 0 ? 'var(--bg)' : 'var(--ink-2)',
      border: i === 0 ? 'var(--ink)' : 'var(--line)',
    }));
    const tag = (label, kind) => ({
      label,
      bg: kind === 'gap' ? 'var(--low-soft)' : kind === 'warn' ? 'var(--high-soft)' : 'var(--sunken)',
      color: kind === 'gap' ? 'var(--low)' : kind === 'warn' ? 'var(--high)' : 'var(--ink-2)',
    });
    // Energieverdeling (%) en grammen per 100 g
    const results = [
      { src: 'FR', name: 'Zalm, wild, rauw', sub: 'Saumon, cru, sauvage · CIQUAL', kcal: '166', p: 51, c: 0, f: 49, pg: '21', cg: '0', fg: '9,2', tags: [tag('+ Vit. D 73%', 'gap'), tag('+ Jodium 8%', 'gap'), tag('EPA+DHA 1,6 g')] },
      { src: 'NO', name: 'Zalm, gekweekt, rauw', sub: 'Laks, oppdrett, rå · Matvaretabellen', kcal: '223', p: 37, c: 0, f: 63, pg: '20', cg: '0', fg: '15,6', tags: [tag('+ Vit. D 53%', 'gap'), tag('EPA+DHA 2,0 g'), tag('Seleen 43%')] },
      { src: 'FR', name: 'Zalm, gerookt', sub: 'Saumon fumé · CIQUAL', kcal: '178', p: 52, c: 0, f: 48, pg: '23', cg: '0', fg: '9,5', tags: [tag('+ Vit. D 67%', 'gap'), tag('Natrium 59% van max', 'warn')] },
      { src: 'OFF', name: 'Zalmfilet met huid', sub: '[MERK] · Open Food Facts · micro’s ≈ uit CIQUAL', kcal: '208', p: 40, c: 0, f: 60, pg: '20', cg: '0', fg: '13,9', tags: [tag('+ Vit. D ≈ 60%', 'gap'), tag('EPA+DHA ≈ 1,8 g')] },
      { src: 'SE', name: 'Zalmforel, rauw', sub: 'Laxöring rå · Livsmedelsverket', kcal: '143', p: 58, c: 0, f: 42, pg: '20', cg: '0', fg: '6,7', tags: [tag('+ Vit. D 47%', 'gap'), tag('B12 125%')] },
    ];
    const recent = [
      { name: 'Skyr natuur', amount: '150 g · ontbijt', kcal: '95' },
      { name: 'Havervlokken', amount: '60 g · ontbijt', kcal: '224' },
      { name: 'Broccoli, gekookt', amount: '200 g · avondeten', kcal: '70' },
    ].map((r, i, a) => ({ ...r, kcal: r.kcal + ' kcal', aria: r.name + ' opnieuw toevoegen', border: i === a.length - 1 ? 'transparent' : 'var(--line)' }));
    return { theme: dark ? 't-dark' : 't-light', scopes, results, recent };
  }
}
</script>
</body>
</html>
