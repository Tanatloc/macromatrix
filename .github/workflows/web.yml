# Webversie bouwen en op Cloudflare Pages zetten bij elke push naar main (of met de hand).
# Nodig als secrets in de GitHub-repo: CLOUDFLARE_API_TOKEN en CLOUDFLARE_ACCOUNT_ID (supabase.json staat in de repo).
name: Webversie

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: tool/build_site.sh
      - name: Naar Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/site --project-name=voedingsapp --branch=master
